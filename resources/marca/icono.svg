<!--
  Marca provisoria de MiSalud.

  Es genérica a propósito: una cruz médica de puntas redondeadas sobre un
  cuadrado. Sirve para tener la PWA instalable con un ícono propio mientras no
  exista la marca definitiva.

  Este archivo es la FUENTE. Los PNG del set (públicos en /icons) se generan
  desde acá con `npm run generar:iconos`, nunca a mano: así el día que se
  reemplace por la marca real alcanza con cambiar este SVG y volver a correr el
  comando.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <rect width="512" height="512" rx="112" fill="#0e7490" />
    <g fill="#ffffff">
        <rect x="206" y="112" width="100" height="288" rx="30" />
        <rect x="112" y="206" width="288" height="100" rx="30" />
    </g>
</svg>
